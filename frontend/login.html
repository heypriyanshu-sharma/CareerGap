<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In — CareerGap</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

<main class="login-page">

    <section class="login-card">

        <a
            href="index.html"
            class="brand"
            aria-label="CareerGap home"
        >

            <svg
                class="brand-leaf"
                viewBox="0 0 40 40"
                aria-hidden="true"
            >

                <path
                    d="M33 6C18 7 8 14 7 25c0 5 3 8 7 8 10-1 17-11 19-27Z"
                />

                <path
                    d="M9 31C14 23 20 18 29 12"
                />

            </svg>

            <span>CareerGap</span>

        </a>


        <div class="login-heading">

            <p class="eyebrow">
                WELCOME BACK
            </p>

            <h1>
                Continue<br>
                growing.
            </h1>

            <p class="login-description">
                Sign in to continue your career readiness journey.
            </p>

        </div>


        <form
    class="login-form"
    id="login-form"
    onsubmit="return false;"
>

            <div class="form-field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-field">

                <div class="password-label">

                    <label for="password">
                        Password
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="button"
                class="login-button"
            >
                Sign In
                <span>→</span>
            </button>

        </form>


        <div class="signup-prompt">

            <span>
                Don't have an account?
            </span>

            <a href="#">
                Create one
            </a>

        </div>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to CareerGap
        </a>

    </section>


    <div class="login-decoration">

        <span class="leaf-dot leaf-dot-one"></span>
        <span class="leaf-dot leaf-dot-two"></span>
        <span class="leaf-dot leaf-dot-three"></span>

    </div>

</main>

</body>

</html>
