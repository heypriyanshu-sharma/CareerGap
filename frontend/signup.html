<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account — CareerGap</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="signup.js" defer></script>

</head>

<body>

<main class="login-page">

    <section class="login-card">

        <a
            href="login.html"
            class="brand"
            aria-label="CareerGap sign in"
        >

            <svg
                class="brand-leaf"
                viewBox="0 0 40 40"
                aria-hidden="true"
            >

                <path
                    d="M33 6C18 7 8 14 7 25c0 5 3 8 7 8 10-1 17-11 19-27Z"
                />

                <path
                    d="M9 31C14 23 20 18 29 12"
                />

            </svg>

            <span>CareerGap</span>

        </a>


        <div class="login-heading">

            <p class="eyebrow">
                START HERE
            </p>

            <h1>
                Start<br>
                growing.
            </h1>

            <p class="login-description">
                Create your account and begin your career readiness journey.
            </p>

        </div>


        <form
            class="login-form"
            id="signup-form"
        >

            <div class="form-field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-field">

                <label for="password">
                    Password
                </label>

                <div class="password-input-wrap">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        id="password-toggle"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <svg
                            class="password-eye password-eye-open"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                            />
                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                            />
                        </svg>

                        <svg
                            class="password-eye password-eye-closed hidden"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M3 3l18 18"
                            />
                            <path
                                d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a17.8 17.8 0 0 1-3.2 3.8"
                            />
                            <path
                                d="M6.5 8.1C3.8 9.8 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.8"
                            />
                        </svg>
                    </button>

                </div>

            </div>


            <div class="form-field">

                <label for="confirm-password">
                    Confirm password
                </label>

                <div class="password-input-wrap">

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        id="confirm-password-toggle"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <svg
                            class="password-eye password-eye-open"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                            />
                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                            />
                        </svg>

                        <svg
                            class="password-eye password-eye-closed hidden"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M3 3l18 18"
                            />
                            <path
                                d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a17.8 17.8 0 0 1-3.2 3.8"
                            />
                            <path
                                d="M6.5 8.1C3.8 9.8 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.8"
                            />
                        </svg>
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Create Account
                <span>→</span>
            </button>

        </form>


        <div class="signup-prompt">

            <span>
                Already have an account?
            </span>

            <a href="login.html">
                Sign in
            </a>

        </div>


        <a
            href="login.html"
            class="back-link"
        >
            ← Back to Sign In
        </a>

    </section>


    <div class="login-decoration">

        <span class="leaf-dot leaf-dot-one"></span>
        <span class="leaf-dot leaf-dot-two"></span>
        <span class="leaf-dot leaf-dot-three"></span>

    </div>

</main>

</body>

</html>
