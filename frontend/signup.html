<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account — CareerGap</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="signup.js" defer></script>

</head>

<body>

<main class="login-page">

    <section class="login-card">

        <a
            href="login.html"
            class="brand"
            aria-label="CareerGap sign in"
        >

            <svg
                class="brand-leaf"
                viewBox="0 0 40 40"
                aria-hidden="true"
            >

                <path
                    d="M33 6C18 7 8 14 7 25c0 5 3 8 7 8 10-1 17-11 19-27Z"
                />

                <path
                    d="M9 31C14 23 20 18 29 12"
                />

            </svg>

            <span>CareerGap</span>

        </a>


        <div class="login-heading">

            <p class="eyebrow">
                START HERE
            </p>

            <h1>
                Start<br>
                growing.
            </h1>

            <p class="login-description">
                Create your account and begin your career readiness journey.
            </p>

        </div>


        <form
            class="login-form"
            id="signup-form"
        >

            <div class="form-field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="form-field">

                <label for="confirm-password">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Enter your password again"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Create Account
                <span>→</span>
            </button>

        </form>


        <div class="signup-prompt">

            <span>
                Already have an account?
            </span>

            <a href="login.html">
                Sign in
            </a>

        </div>


        <a
            href="login.html"
            class="back-link"
        >
            ← Back to Sign In
        </a>

    </section>


    <div class="login-decoration">

        <span class="leaf-dot leaf-dot-one"></span>
        <span class="leaf-dot leaf-dot-two"></span>
        <span class="leaf-dot leaf-dot-three"></span>

    </div>

</main>

</body>

</html>
