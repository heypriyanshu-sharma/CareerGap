<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="api-base-url" content="">

    <title>My Profile — CareerGap</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="account-page">


<!-- =========================================================
     NAVBAR
========================================================= -->

<header class="navbar">

    <div class="nav-inner">

        <a href="index.html" class="brand">

            <svg
                class="brand-leaf"
                viewBox="0 0 40 40"
                aria-hidden="true"
            >
                <path
                    d="M33 6C18 7 8 14 7 25c0 5 3 8 7 8 10-1 17-11 19-27Z"
                />

                <path
                    d="M9 31C14 23 20 18 29 12"
                />

            </svg>

            <span>CareerGap</span>

        </a>


        <nav class="primary-nav" aria-label="Primary navigation">

            <a
                href="index.html"
                class="primary-nav-btn"
            >
                Back to CareerGap
            </a>

        </nav>

    </div>

</header>



<main class="account-main">


    <!-- =========================================================
         PROFILE
    ========================================================= -->

    <section
        class="account-card"
        aria-labelledby="profile-heading"
    >

        <header class="account-card-header">

            <p class="eyebrow">
                YOUR ACCOUNT
            </p>

            <h1 id="profile-heading">
                My Profile
            </h1>

        </header>


        <div class="profile-summary">

            <span
                id="profile-page-avatar"
                class="profile-page-avatar"
                aria-hidden="true"
            ></span>

            <div>
                <p id="profile-page-name" class="profile-page-name"></p>
                <p id="profile-page-email" class="profile-page-email"></p>
            </div>

        </div>


        <form
            id="profile-form"
            class="account-form"
            novalidate
        >

            <div class="account-field">

                <label for="profile-full-name">
                    Full name
                </label>

                <input
                    type="text"
                    id="profile-full-name"
                    maxlength="120"
                    autocomplete="name"
                    placeholder="Your name"
                >

            </div>


            <div class="account-field">

                <label for="profile-target-role">
                    Target role
                </label>

                <input
                    type="text"
                    id="profile-target-role"
                    maxlength="120"
                    placeholder="e.g. Backend Engineer"
                >

            </div>


            <div class="account-field">

                <label for="profile-experience-level">
                    Experience level
                </label>

                <select id="profile-experience-level">

                    <option value="">
                        Not set
                    </option>

                    <option value="student">
                        Student
                    </option>

                    <option value="junior">
                        Junior
                    </option>

                    <option value="mid">
                        Mid-level
                    </option>

                    <option value="senior">
                        Senior
                    </option>

                    <option value="lead">
                        Lead
                    </option>

                </select>

            </div>


            <div class="account-actions">

                <button
                    type="submit"
                    id="profile-save"
                    class="account-primary-button"
                >
                    Save profile
                </button>

                <span
                    id="profile-status"
                    class="account-status"
                    role="status"
                    aria-live="polite"
                ></span>

            </div>

        </form>

    </section>


    <!-- =========================================================
         ACCOUNT SECURITY
    ========================================================= -->

    <section
        class="account-card"
        aria-labelledby="security-heading"
    >

        <header class="account-card-header">

            <p class="eyebrow">
                ACCOUNT SECURITY
            </p>

            <h2 id="security-heading">
                Password
            </h2>

        </header>


        <div class="account-row">

            <div>

                <p class="account-row-label">
                    Password
                </p>

                <p class="account-row-hint">
                    ••••••••••••••••
                </p>

            </div>

            <button
                type="button"
                id="change-password"
                class="account-secondary-button"
            >
                Change password
            </button>

        </div>


        <form
            id="change-password-form"
            class="account-form hidden"
        >

            <div class="account-field">

                <label for="new-password">
                    New password
                </label>

                <div class="password-input-wrap">

                    <input
                        type="password"
                        id="new-password"
                        autocomplete="new-password"
                        placeholder="Enter new password"
                    >

                    <button
                        type="button"
                        id="new-password-toggle"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <svg
                            class="password-eye password-eye-open"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                            />
                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                            />
                        </svg>

                        <svg
                            class="password-eye password-eye-closed hidden"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M3 3l18 18"
                            />
                            <path
                                d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a17.8 17.8 0 0 1-3.2 3.8"
                            />
                            <path
                                d="M6.5 8.1C3.8 9.8 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.8"
                            />
                        </svg>
                    </button>

                </div>

            </div>


            <div class="account-field">

                <label for="confirm-new-password">
                    Confirm new password
                </label>

                <div class="password-input-wrap">

                    <input
                        type="password"
                        id="confirm-new-password"
                        autocomplete="new-password"
                        placeholder="Enter new password again"
                    >

                    <button
                        type="button"
                        id="confirm-new-password-toggle"
                        class="password-toggle"
                        aria-label="Show password confirmation"
                        aria-pressed="false"
                    >
                        <svg
                            class="password-eye password-eye-open"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                            />
                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                            />
                        </svg>

                        <svg
                            class="password-eye password-eye-closed hidden"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M3 3l18 18"
                            />
                            <path
                                d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a17.8 17.8 0 0 1-3.2 3.8"
                            />
                            <path
                                d="M6.5 8.1C3.8 9.8 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.8"
                            />
                        </svg>
                    </button>

                </div>

            </div>


            <div class="account-actions">

                <button
                    type="submit"
                    id="update-password"
                    class="account-primary-button"
                >
                    Update Password
                </button>

                <span
                    id="password-status"
                    class="account-status"
                    role="status"
                    aria-live="polite"
                ></span>

            </div>

        </form>

    </section>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="profile.js"></script>

</body>

</html>
